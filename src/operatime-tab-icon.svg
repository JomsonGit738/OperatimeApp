<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="background" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8f1732"/>
      <stop offset="1" stop-color="#4d0717"/>
    </linearGradient>
    <linearGradient id="ticket" x1="18" y1="15" x2="47" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2d9df"/>
    </linearGradient>
  </defs>

  <!-- Rounded background remains readable at browser-tab sizes. -->
  <rect width="64" height="64" rx="15" fill="url(#background)"/>

  <!-- A compact cinema ticket silhouette with clipped side notches. -->
  <path
    fill="url(#ticket)"
    d="M16 15h32a3 3 0 0 1 3 3v7.2a7 7 0 0 0 0 13.6V46a3 3 0 0 1-3 3H16a3 3 0 0 1-3-3v-7.2a7 7 0 0 0 0-13.6V18a3 3 0 0 1 3-3Z"
  />

  <!-- Play symbol communicates movies without relying on tiny text. -->
  <path fill="#711027" d="M27 23.2a2 2 0 0 1 3.05-1.7l13.1 8.8a2 2 0 0 1 0 3.4l-13.1 8.8A2 2 0 0 1 27 40.8V23.2Z"/>
</svg>
